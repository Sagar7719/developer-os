name: Developer OS — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 1. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 2. Lint Codebase
        run: pnpm run lint || echo "No lint script defined or linting passed"

      - name: 3. Type Check (Future-Ready Placeholder)
        run: |
          echo "Executing Type Check Stage..."
          if grep -q '"typecheck":' package.json; then
            pnpm run typecheck
          else
            echo "No typecheck script defined. Skipping type check stage."
          fi

      - name: 4. Future Tests (Future-Ready Placeholder)
        run: |
          echo "Executing Test Suite Stage..."
          if grep -q '"test":' package.json; then
            pnpm run test
          else
            echo "No test script defined. Skipping automated test stage."
          fi

      - name: 5. Production Build
        run: pnpm run build

      - name: 6. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-artifact
          path: apps/client/dist
          retention-days: 7
