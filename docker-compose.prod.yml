name: developer-os-prod

services:
  mongodb:
    image: mongo:7.0
    container_name: developer-os-mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: developer_os
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prod-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: developer-os-server-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL}
      TRUST_PROXY: 1
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prod-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: developer-os-client-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  mongo-prod-data:
    driver: local
