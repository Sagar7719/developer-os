name: developer-os-dev

services:
  mongodb:
    image: mongo:7.0
    container_name: developer-os-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: developer_os
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dev-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: developer-os-server-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/developer_os
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: dev-access-secret-change-in-env
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-env
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dev-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: developer-os-client-dev
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  mongo-dev-data:
    driver: local
